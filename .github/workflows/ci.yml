name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
