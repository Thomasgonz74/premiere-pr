<style>

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --line: #2b343e; --accent: #86adff; --accent-ink: #0b1524; --silicone: #ff7b5c; --vent: #86adff;

.hint { position: absolute; left: 12px; bottom: 10px; right: 12px; font-size: .78rem; color: var(--muted); pointer-events: none; }

.note h2 { font: 600 .95rem var(--f-body); margin: 0 0 6px; }
.note ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 90ch; }

<script id="geo">
/* Geometrie pure : portage de cotes_derivees()/profil() de snap_cap_gp90.py (mm, demi-plan r/z). */
var GP90 = (function () {
  var K = {
    tol: -0.05,
    dCulot: 9.58, epBourrelet: 1.14, chanfreinCulot: 0.30, dFondGorge: 8.43, largeurGorge: 1.70, angleGorge: 35,
    zP1: 3.30, dP1: 9.55, zEpaulement: 36.57, dP2: 9.00, angleEpaulement: 23, zColletSpec: 40.35,
    dH1: 6.43, dH2: 6.43, lDouille: 44.70, conge: 0.50,
    dOgive: 5.69, oal: 57.20, rOgive: 38.0, rPointe: 0.65,
    dPuits: 4.45, profPuits: 3.30, chanfreinPuits: 0.30, zAncrage: 2.00, surRayon: 0.35, hAncrage: 0.80, dEvent: 1.00

  var sub = function (a, b) { return [a[0] - b[0], a[1] - b[1]]; };
  var add = function (a, b) { return [a[0] + b[0], a[1] + b[1]]; };
  var mul = function (a, k) { return [a[0] * k, a[1] * k]; };
  var unit = function (a) { var n = Math.hypot(a[0], a[1]); return [a[0] / n, a[1] / n]; };
  var rad = function (deg) { return deg * Math.PI / 180; };
  var rExt = function (d) { return (d + K.tol) / 2; };

  function conge(prev, corner, next, radius) {
    var v1 = unit(sub(prev, corner)), v2 = unit(sub(next, corner));
    var half = Math.acos(Math.max(-1, Math.min(1, v1[0] * v2[0] + v1[1] * v2[1]))) / 2;
    var setback = radius / Math.tan(half), bis = unit(add(v1, v2));
    return [add(corner, mul(v1, setback)), add(corner, mul(v2, setback)), add(corner, mul(bis, radius / Math.sin(half)))];
  }

  function derived() {
    var rg = K.dFondGorge / 2, rP1 = rExt(K.dP1), rP2 = rExt(K.dP2), rH1 = rExt(K.dH1), rOg = K.dOgive / 2;
    var zGorgeHaut = K.epBourrelet + K.largeurGorge;
    var pc = (rP2 - rP1) / (K.zEpaulement - K.zP1), pg = 1 / Math.tan(rad(K.angleGorge));
    var zCorps = (rP1 - pc * K.zP1 - rg + pg * zGorgeHaut) / (pg - pc), rCorps = rP1 + pc * (zCorps - K.zP1);
    var zCollet = K.zEpaulement + (rP2 - rH1) / Math.tan(rad(K.angleEpaulement));
    var angleSpec = Math.atan2(rP2 - rH1, K.zColletSpec - K.zEpaulement) * 180 / Math.PI;
    // Ogive secante : cercle de rayon rOgive par le bord aux levres, tangent a la sphere de pointe.
    var base = [rOg, K.lDouille], cP = [0, K.oal - K.rPointe], rho = K.rOgive;
    var d = Math.hypot(cP[0] - base[0], cP[1] - base[1]);
    var a = (rho * rho - (rho - K.rPointe) * (rho - K.rPointe) + d * d) / (2 * d), h = Math.sqrt(rho * rho - a * a);
    var u = unit(sub(cP, base)), pied = add(base, mul(u, a));
    var c1 = add(pied, mul([-u[1], u[0]], h)), c2 = add(pied, mul([-u[1], u[0]], -h)), cO = c1[0] < c2[0] ? c1 : c2;
    var raccord = add(cO, mul(unit(sub(cP, cO)), rho));
    var eA = [K.dPuits / 2 - K.dEvent / 2, K.profPuits], eB = [rg, K.epBourrelet + K.largeurGorge / 2];
    return { zGorgeHaut: zGorgeHaut, zCorps: zCorps, rCorps: rCorps, zCollet: zCollet, angleSpec: angleSpec,
      feuillure: rExt(K.dH2) - rOg, cOgive: cO, cPointe: cP, raccord: raccord,
      angleBase: Math.asin((base[1] - cO[1]) / rho) * 180 / Math.PI,
      eventA: eA, eventB: eB, inclinaison: Math.atan2(eA[1] - eB[1], eB[0] - eA[0]) * 180 / Math.PI,
      zu0: K.zAncrage, zu1: K.zAncrage + K.hAncrage, dAncrage: K.dPuits + 2 * K.surRayon };
  }

  /* Polyligne du fond du puits (sur l'axe) jusqu'a la pointe (sur l'axe). Arcs echantillonnes finement (voir A). */
  function polyline() {
    var d = derived(), pts = [], rp = K.dPuits / 2, ra = rp + K.surRayon, rc = rExt(K.dCulot), rg = K.dFondGorge / 2, rOg = K.dOgive / 2;
    var L = function (r, z) { pts.push([r, z]); };

      var a0 = Math.atan2(from[1] - ctr[1], from[0] - ctr[0]), da = Math.atan2(to[1] - ctr[1], to[0] - ctr[0]) - a0;
      while (da > Math.PI) da -= 2 * Math.PI; while (da <= -Math.PI) da += 2 * Math.PI;
      var pas = Math.min(rad(2), 2 * Math.acos(1 - 0.0005 / radius)); // fleche de corde <= 0,0005 mm
      var n = Math.max(8, Math.ceil(Math.abs(da) / pas));
      for (var k = 1; k < n; k++) L(ctr[0] + radius * Math.cos(a0 + da * k / n), ctr[1] + radius * Math.sin(a0 + da * k / n));
      L(to[0], to[1]);
    };
    L(0, K.profPuits); L(rp, K.profPuits); L(rp, d.zu1); L(ra, d.zu1); L(ra, d.zu0); L(rp, d.zu0); L(rp, K.chanfreinPuits); L(rp + K.chanfreinPuits, 0);
    L(rc - K.chanfreinCulot, 0); L(rc, K.chanfreinCulot); L(rc, K.epBourrelet); L(rg, K.epBourrelet); L(rg, d.zGorgeHaut);
    var corps = [[d.rCorps, d.zCorps], [rExt(K.dP2), K.zEpaulement], [rExt(K.dH1), d.zCollet], [rExt(K.dH2), K.lDouille]];
    L(corps[0][0], corps[0][1]);
    for (var i = 1; i <= 2; i++) { var f = conge(corps[i - 1], corps[i], corps[i + 1], K.conge); L(f[0][0], f[0][1]); A(f[0], f[1], f[2], K.conge); }
    L(corps[3][0], corps[3][1]);
    L(rOg, K.lDouille);
    A([rOg, K.lDouille], d.raccord, d.cOgive, K.rOgive);
    A(d.raccord, [0, K.oal], d.cPointe, K.rPointe);

  }

  /* Double les sommets vifs (> 10 deg) pour que la revolution garde des aretes nettes. */
  function withSharpEdges(pts) {
    var out = [pts[0]];

      var u = unit(sub(pts[i], pts[i - 1])), v = unit(sub(pts[i + 1], pts[i]));
      out.push(pts[i]);
      if (u[0] * v[0] + u[1] * v[1] < Math.cos(rad(10))) out.push(pts[i]);
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  /* Sutherland-Hodgman : sujet quelconque, fenetre convexe. */
  function clipPoly(subject, clip) {
    var area = 0, n = clip.length, i;
    for (i = 0; i < n; i++) { var q = clip[(i + 1) % n]; area += clip[i][0] * q[1] - q[0] * clip[i][1]; }
    var sign = area >= 0 ? 1 : -1, out = subject;
    for (i = 0; i < n && out.length; i++) {

      var side = function (pt) { return sign * ((b[0] - a[0]) * (pt[1] - a[1]) - (b[1] - a[1]) * (pt[0] - a[0])); };
      for (var j = 0; j < input.length; j++) {
        var cur = input[j], prev = input[(j + input.length - 1) % input.length], sc = side(cur), sp = side(prev);
        if (sc >= 0) { if (sp < 0) out.push(add(prev, mul(sub(cur, prev), sp / (sp - sc)))); out.push(cur); }

      }
    }
    return out;
  }

  /* Trace de l'event dans le plan de coupe : bande de 1 mm bornee par le fond du puits et le fond de gorge, limitee a la matiere. */
  function ventSection() {
    var d = derived(), u = unit(sub(d.eventB, d.eventA)), nrm = [-u[1], u[0]], h = K.dEvent / 2, rg = K.dFondGorge / 2;
    var s0 = sub(d.eventA, mul(u, 3)), s1 = add(d.eventB, mul(u, 2));
    var rect = [add(s0, mul(nrm, h)), add(s1, mul(nrm, h)), sub(s1, mul(nrm, h)), sub(s0, mul(nrm, h))];
    var tool = clipPoly(rect, [[K.dPuits / 2, -1], [rg, -1], [rg, K.profPuits], [K.dPuits / 2, K.profPuits]]);
    return clipPoly(polyline(), tool);
  }

  return { K: K, rExt: rExt, derived: derived, polyline: polyline, withSharpEdges: withSharpEdges, ventSection: ventSection, unit: unit, sub: sub };
})();
</script>

<script>
(function () {
  var h = React.createElement, G = GP90, K = G.K;
  var BRASS = 0xc9a450, CUT_BG = '#ecd48f', CUT_LINE = '#7b5c17', HOLE = 0x241c10;

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function hatchTexture() {
    var cv = document.createElement('canvas'); cv.width = cv.height = 64;
    var g = cv.getContext('2d');
    g.fillStyle = CUT_BG; g.fillRect(0, 0, 64, 64);
    g.strokeStyle = CUT_LINE; g.lineWidth = 3;
    for (var k = -64; k <= 64; k += 32) { g.beginPath(); g.moveTo(k, 64); g.lineTo(k + 64, 0); g.stroke(); }
    var t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1.1, 1.1);
    return t;
  }

  /* Paroi de l'event (tube incline) ajustee entre deux rayons ; ou pastille de son embouchure sur le fond de gorge. */
  function ventTube(rIn, rOut, capOnly) {
    var d = G.derived(), u = G.unit(G.sub(d.eventB, d.eventA)), nx = -u[1], nz = u[0], rv = K.dEvent / 2, N = 40;
    var pos = [], idx = [], i, b;
    var at = function (t, radius) {
      var cx = rv * Math.cos(t), y = rv * Math.sin(t);
      var s = (Math.sqrt(radius * radius - y * y) - d.eventA[0] - cx * nx) / u[0];
      return [d.eventA[0] + s * u[0] + cx * nx, d.eventA[1] + s * u[1] + cx * nz, y];
    };
    if (capOnly) {
      pos.push(d.eventB[0] + 0.02, d.eventB[1], 0);
      for (i = 0; i <= N; i++) { b = at(i / N * 2 * Math.PI, rOut + 0.02); pos.push(b[0], b[1], b[2]); if (i < N) idx.push(0, i + 1, i + 2); }
    } else {
      for (i = 0; i <= N; i++) {
        var t = i / N * 2 * Math.PI, a = at(t, rIn); b = at(t, rOut);
        pos.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        if (i < N) { var k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx); geo.computeVertexNormals();
    return geo;
  }

  function buildModel(mats) {
    var poly = G.polyline(), d = G.derived(), grp = new THREE.Group();
    var lathePts = G.withSharpEdges(poly).map(function (q) { return new THREE.Vector2(q[0], q[1]); });
    var full = new THREE.LatheGeometry(lathePts, 144), half = new THREE.LatheGeometry(lathePts, 72, Math.PI / 2, Math.PI);

    // Face de coupe : le meme profil, a droite puis en miroir a gauche.
    var ring = poly.concat(poly.slice(1, -1).reverse().map(function (q) { return [-q[0], q[1]]; }));
    var face = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(ring.map(function (q) { return new THREE.Vector2(q[0], q[1]); }))), mats.cut);
    var edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ring.map(function (q) { return new THREE.Vector3(q[0], q[1], 0.012); })), mats.edge);
    var ventFace = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(G.ventSection().map(function (q) { return new THREE.Vector2(q[0], q[1]); }))), mats.vent);
    ventFace.position.z = 0.02;

    // Volume du puits (ce que remplit le mastic), legerement retreint pour ne pas coller a la paroi.
    var rp = K.dPuits / 2 * 0.985, ra = (K.dPuits / 2 + K.surRayon) * 0.985, e = 0.01;
    var pocketPts = [[0, e], [rp + K.chanfreinPuits, e], [rp, K.chanfreinPuits], [rp, d.zu0], [rp, d.zu0], [ra, d.zu0], [ra, d.zu0], [ra, d.zu1], [ra, d.zu1], [rp, d.zu1], [rp, d.zu1], [rp, K.profPuits - e], [rp, K.profPuits - e], [0, K.profPuits - e]]
      .map(function (q) { return new THREE.Vector2(q[0], q[1]); });

      solid: new THREE.Mesh(full, mats.brass), half: new THREE.Mesh(half, mats.brass),
      face: face, edge: edge, ventFace: ventFace,
      shell: new THREE.Mesh(full, mats.glass),
      pocket: new THREE.Mesh(new THREE.LatheGeometry(pocketPts, 64), mats.silicone),
      tube: new THREE.Mesh(ventTube(K.dPuits / 2 * 0.98, K.dFondGorge / 2), mats.ventTube),
      hole: new THREE.Mesh(ventTube(0, K.dFondGorge / 2, true), mats.hole)

    Object.keys(parts).forEach(function (k) { grp.add(parts[k]); });

  }

  function createStage(host) {
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.localClippingEnabled = true;
    host.insertBefore(renderer.domElement, host.firstChild);
    var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1, 1, 800);
    scene.add(camera);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.75));
    var key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(-0.6, 0.8, 1); camera.add(key);
    var rim = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(40, 20, -60); scene.add(rim);

    var floorClip = new THREE.Plane(new THREE.Vector3(0, -1, 0), K.profPuits); // l'event ne monte pas au-dessus du fond du puits
    var mats = {
      brass: new THREE.MeshStandardMaterial({ color: BRASS, metalness: 0.35, roughness: 0.42, side: THREE.DoubleSide }),
      glass: new THREE.MeshStandardMaterial({ color: BRASS, metalness: 0.2, roughness: 0.5, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide }),
      cut: new THREE.MeshBasicMaterial({ map: hatchTexture(), side: THREE.DoubleSide }),
      edge: new THREE.LineBasicMaterial({ color: 0x3c2c08 }),
      vent: new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }),
      ventTube: new THREE.MeshStandardMaterial({ roughness: 0.6, side: THREE.DoubleSide, clippingPlanes: [floorClip] }),
      silicone: new THREE.MeshStandardMaterial({ roughness: 0.55, side: THREE.DoubleSide }),
      hole: new THREE.MeshBasicMaterial({ color: HOLE, side: THREE.DoubleSide })
    };
    function applyTheme() {
      renderer.setClearColor(new THREE.Color(cssVar('--stage')), 1);
      mats.vent.color.set(cssVar('--vent')); mats.ventTube.color.set(cssVar('--vent')); mats.silicone.color.set(cssVar('--silicone'));
    }

    mq.addEventListener && mq.addEventListener('change', applyTheme);
    var mo = new MutationObserver(applyTheme); mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    // Cartouche couchee (culot a gauche) sur un ecran large, debout sur un ecran etroit.
    var model = buildModel(mats), parts = model.userData.parts;
    var lying = host.clientWidth >= host.clientHeight;
    if (lying) model.rotation.z = -Math.PI / 2;
    scene.add(model); model.updateMatrixWorld(true);
    floorClip.applyMatrix4(model.matrixWorld);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08; controls.screenSpacePanning = true;
    controls.minDistance = 8; controls.maxDistance = 400; controls.zoomSpeed = 0.9;

    var raf = 0;
    function frame(preset) {
      var base = preset === 'culot', along = base ? 9 : K.oal + 5, across = base ? 13 : 14;
