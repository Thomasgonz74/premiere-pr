<style>

<script id="geo">
/* Geometrie pure : portage de ladestreifen_c96.py (sections YZ, stations en X, jeux) et profil de la cartouche 9x19 temoin. */
var Lame = (function () {
  var K = {
    tol: -0.08, dos: 1.20, L: 101.50, capacite: 10,
    largeurDos: 13.40, largeurFlancs: 11.80, hAiles: 3.40, ecartBourrelet: 10.15, hBourrelet: 1.40,
    ecartLevres: 8.65, anglePente: 45, conge: 0.40, portee: 0.40, angleDegagement: 45,
    ecartBout: 8.10, angleRampe: 30, lRetention: 1.20, chanfrein: 0.50
  };
  /* Cartouche temoin : snap cap 9x19 (memes cotes que snap_caps.py). */
  var T = { dCulot: 9.96, epBourrelet: 1.27, chanfreinCulot: 0.30, dGorge: 8.40, largeurGorge: 1.45, angleGorge: 35, dCorps: 9.93,
    lDouille: 19.15, dLevres: 9.65, dOgive: 9.02, oal: 29.30, rPointe: 1.8,
    dPuits: 4.45, profPuits: 3.30, chanfreinPuits: 0.30, zAncrage: 2.00, surRayon: 0.35, hAncrage: 0.80 };
  var rad = function (d) { return d * Math.PI / 180; };
  var sub = function (a, b) { return [a[0] - b[0], a[1] - b[1]]; };
  var add = function (a, b) { return [a[0] + b[0], a[1] + b[1]]; };
  var mul = function (a, k) { return [a[0] * k, a[1] * k]; };
  var unit = function (a) { var n = Math.hypot(a[0], a[1]); return [a[0] / n, a[1] / n]; };

  function cotes() {
    var demiLevres = K.ecartLevres / 2, demiBout = K.ecartBout / 2;
    var rampe = (demiLevres - demiBout) / Math.tan(rad(K.angleRampe));
    return { demiDos: (K.largeurDos + K.tol) / 2, demiFlancs: (K.largeurFlancs + K.tol) / 2, demiBourrelet: K.ecartBourrelet / 2,
      demiLevres: demiLevres, demiBout: demiBout, hauteur: K.dos + K.hAiles, zLevres: K.dos + K.hBourrelet,
      rampe: rampe, palier: K.lRetention - K.chanfrein - rampe };
  }

  /* Face interne d'une levre d'ecartement 2w, du bas vers le haut. degage = false : verticale jusqu'en haut. */
  function profilLevre(w, degage) {
    var c = cotes(), zPente = c.zLevres + (c.demiBourrelet - w) * Math.tan(rad(K.anglePente));
    var pts = [[c.demiBourrelet, c.zLevres], [w, zPente]];
    if (!degage) pts.push([w, c.hauteur]);
    else { var zDeg = zPente + K.portee; pts.push([w, zDeg], [w + (c.hauteur - zDeg) * Math.tan(rad(K.angleDegagement)), c.hauteur]); }
    return pts;
  }

  /* Section complete (polygone ferme, sens anti-horaire), conge echantillonne. */
  function section(w, degage) {
    var c = cotes(), d = [[c.demiDos, 0], [c.demiDos, K.dos], [c.demiFlancs, K.dos], [c.demiFlancs, c.hauteur]];
    profilLevre(w, degage).slice().reverse().forEach(function (p) { d.push(p); });
    var cx = c.demiBourrelet - K.conge, cz = K.dos + K.conge, n = 8;
    for (var i = 0; i <= n; i++) { var a = -Math.PI / 2 * i / n; d.push([cx + K.conge * Math.cos(a), cz + K.conge * Math.sin(a)]); }
    return d.concat(d.slice().reverse().map(function (p) { return [-p[0], p[1]]; }));
  }

  /* (x, demi-ecartement) : chanfrein d'entree, palier resserre, rampe a 30 deg, partie courante, extremite symetrique. */
  function stations() {
    var c = cotes(), s = [[0, c.demiBout + K.chanfrein], [K.chanfrein, c.demiBout], [K.chanfrein + c.palier, c.demiBout], [K.lRetention, c.demiLevres]];
    return s.concat(s.slice().reverse().map(function (p) { return [K.L - p[0], p[1]]; }));
  }

  function rayonTemoin(z) {
    var rg = T.dGorge / 2, zg = T.epBourrelet + T.largeurGorge;
    if (z <= T.epBourrelet) return T.dCulot / 2;
    if (z <= zg) return rg;
    return Math.min(T.dCorps / 2, rg + (z - zg) * Math.tan(rad(T.angleGorge)));
  }
  function demiEcart(z, profil) {
    for (var i = 0; i < profil.length - 1; i++) {
      var p = profil[i], q = profil[i + 1];
      if (p[1] <= z && z <= q[1]) return q[1] === p[1] ? p[0] : p[0] + (q[0] - p[0]) * (z - p[1]) / (q[1] - p[1]);
    }
    return profil[profil.length - 1][0];
  }
  /* Jeux par cote entre la lame et la cartouche temoin posee sur le dos ; negatif = interference. */
  function ajustement(degage) {
    var c = cotes(), profil = profilLevre(c.demiLevres, degage), rc = T.dCulot / 2, rg = T.dGorge / 2, mini = Infinity, zMini = 0;
    for (var z = c.zLevres; z <= c.hauteur + 1e-9; z += 0.001) {
      if (z - K.dos <= T.epBourrelet + 1e-9) continue;
      var j = demiEcart(z, profil) - rayonTemoin(z - K.dos);
      if (j < mini - 1e-9) { mini = j; zMini = z; }
    }
    var zContact = c.zLevres + (c.demiBourrelet - rc) * Math.tan(rad(K.anglePente));
    var xButee = K.chanfrein + c.palier + Math.sqrt(Math.max(0, rg * rg - c.demiBout * c.demiBout));
    return { engagement: rc - c.demiLevres, jeuLateral: c.demiBourrelet - rc, jeuAxial: zContact - (K.dos + T.epBourrelet),
      jeuGorge: c.demiLevres - rg, jeuMini: mini, zMini: zMini, paroi: c.demiFlancs - c.demiBourrelet,
      serrage: rg - c.demiBout, depassement: rc - xButee, jeuX: (K.L - 2 * xButee) - (K.capacite - 1) * T.dCulot };
  }

  /* Demi-profil (r, z) de la cartouche temoin, du fond du puits a la pointe. */
  function temoin() {
    var pts = [], rp = T.dPuits / 2, ra = rp + T.surRayon, rr = T.dCulot / 2, rg = T.dGorge / 2, rb = T.dCorps / 2, ro = T.dOgive / 2;
    var zg = T.epBourrelet + T.largeurGorge, zb = zg + (rb - rg) / Math.tan(rad(T.angleGorge));
    var len = T.oal - T.lDouille, rn = T.rPointe, rho = (ro * ro + (len - rn) * (len - rn) - rn * rn) / (2 * (ro - rn));
    var oc = [ro - rho, T.lDouille], nc = [0, T.oal - rn], tg = add(oc, mul(unit(sub(nc, oc)), rho));
    var L = function (r, z) { pts.push([r, z]); };
    var A = function (from, to, ctr, radius) {
      var a0 = Math.atan2(from[1] - ctr[1], from[0] - ctr[0]), da = Math.atan2(to[1] - ctr[1], to[0] - ctr[0]) - a0;
      while (da > Math.PI) da -= 2 * Math.PI; while (da <= -Math.PI) da += 2 * Math.PI;
      var n = Math.max(8, Math.ceil(Math.abs(da) / rad(2)));
      for (var k = 1; k < n; k++) L(ctr[0] + radius * Math.cos(a0 + da * k / n), ctr[1] + radius * Math.sin(a0 + da * k / n));
      L(to[0], to[1]);
    };
    L(0, T.profPuits); L(rp, T.profPuits); L(rp, T.zAncrage + T.hAncrage); L(ra, T.zAncrage + T.hAncrage); L(ra, T.zAncrage); L(rp, T.zAncrage);
    L(rp, T.chanfreinPuits); L(rp + T.chanfreinPuits, 0); L(rr - T.chanfreinCulot, 0); L(rr, T.chanfreinCulot); L(rr, T.epBourrelet);
    L(rg, T.epBourrelet); L(rg, zg); L(rb, zb); L(T.dLevres / 2, T.lDouille); L(ro, T.lDouille);
    A([ro, T.lDouille], tg, oc, rho); A(tg, [0, T.oal], nc, rn);
    return pts;
  }
  function vifs(pts) {
    var out = [pts[0]];
    for (var i = 1; i < pts.length - 1; i++) {
      var u = unit(sub(pts[i], pts[i - 1])), v = unit(sub(pts[i + 1], pts[i]));
      out.push(pts[i]);
      if (u[0] * v[0] + u[1] * v[1] < Math.cos(rad(10))) out.push(pts[i]);
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  /* Sutherland-Hodgman : sujet quelconque, fenetre convexe. */
  function clipPoly(subject, clip) {
    var area = 0, n = clip.length, i;
    for (i = 0; i < n; i++) { var q = clip[(i + 1) % n]; area += clip[i][0] * q[1] - q[0] * clip[i][1]; }
    var sign = area >= 0 ? 1 : -1, out = subject;
    for (i = 0; i < n && out.length; i++) {
      var a = clip[i], b = clip[(i + 1) % n], input = out; out = [];
      var side = function (pt) { return sign * ((b[0] - a[0]) * (pt[1] - a[1]) - (b[1] - a[1]) * (pt[0] - a[0])); };
      for (var j = 0; j < input.length; j++) {
        var cur = input[j], prev = input[(j + input.length - 1) % input.length], sc = side(cur), sp = side(prev);
        if (sc >= 0) { if (sp < 0) out.push(add(prev, mul(sub(cur, prev), sp / (sp - sc)))); out.push(cur); }
        else if (sp >= 0) out.push(add(prev, mul(sub(cur, prev), sp / (sp - sc))));
      }
    }
    return out;
  }
  /* Zone commune a la levre (+Y, partie courante) et a la cartouche temoin dans le plan de coupe ; vide s'il n'y a pas d'interference. */
  function interference(degage) {
    var c = cotes(), levre = [[c.demiFlancs, c.zLevres], [c.demiFlancs, c.hauteur]].concat(profilLevre(c.demiLevres, degage).slice().reverse());
    var cart = temoin().map(function (p) { return [p[0], p[1] + K.dos]; });
    var poly = clipPoly(cart, levre), out = [], aire = 0;
    poly.forEach(function (p) { var q = out[out.length - 1]; if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > 1e-7) out.push(p); });
    for (var k = 0; k < out.length && out.length > 2;) {   // retire les sommets alignes laisses par le decoupage
      var a = out[(k + out.length - 1) % out.length], b = out[k], d = out[(k + 1) % out.length];
      if (Math.abs((b[0] - a[0]) * (d[1] - b[1]) - (b[1] - a[1]) * (d[0] - b[0])) < 1e-9) out.splice(k, 1); else k++;
    }
    for (var i = 0; i < out.length; i++) { var n = out[(i + 1) % out.length]; aire += out[i][0] * n[1] - n[0] * out[i][1]; }
    return Math.abs(aire) / 2 > 1e-4 ? out : [];
  }

  var x1 = (K.L - K.capacite * T.dCulot) / 2 + T.dCulot / 2;   // centre de la 1re cartouche, rangee centree
  return { K: K, T: T, cotes: cotes, profilLevre: profilLevre, section: section, stations: stations, ajustement: ajustement,
    temoin: temoin, vifs: vifs, interference: interference, x1: x1 };
})();
</script>

<script>
(function () {

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hatchTexture(bg, line, flip) {
    var cv = document.createElement('canvas'); cv.width = cv.height = 64;
    var g = cv.getContext('2d');

    var t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping;

  /* Lame : sections reliees par des faces reglees entre stations, plus les deux faces d'extremite. Coordonnees CAO (x, y, z). */
  function lameGeometry(degage) {

    var v = function (x, p) { pos.push(x, p[0], p[1]); };

      var j = (i + 1) % n, x0 = st[k][0], x1 = st[k + 1][0];

      v(x0, secs[k][i]); v(x1, secs[k + 1][j]); v(x1, secs[k + 1][i]);

  }
  /* Face plane dans le plan YZ a l'abscisse x, avec coordonnees de texture en mm. */
  function capGeometry(poly, x) {
    var contour = poly.map(function (p) { return new THREE.Vector2(p[0], p[1]); }), pos = [], uv = [];
    THREE.ShapeUtils.triangulateShape(contour, []).forEach(function (t) { t.forEach(function (i) { pos.push(x, poly[i][0], poly[i][1]); uv.push(poly[i][0] * 1.1, poly[i][1] * 1.1); }); });
    var geo = new THREE.BufferGeometry();

  function createStage(host) {

    scene.add(camera);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.8));
    var key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(-0.6, 0.8, 1); camera.add(key);
    var rim = new THREE.DirectionalLight(0xffffff, 0.3); rim.position.set(60, 40, -80); scene.add(rim);

    // Repere CAO (X longueur, Y largeur, Z hauteur) pose dans le repere Three (Y vers le haut), lame centree.
    var root = new THREE.Group(); root.rotation.x = -Math.PI / 2; root.position.x = -K.L / 2; scene.add(root);
    var xCoupe = G.x1, cutPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), -(xCoupe - K.L / 2));
    var mats = {
